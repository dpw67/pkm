Recipe:
  - id: pkm:rec/weeknight-chili
    name: Weeknight chili
    instructions:
      - Brown the beef in a heavy pot, breaking it up as it cooks.
      - Add the tomatoes and beans; simmer uncovered for 40 minutes.
      - Season, then rest off the heat for 10 minutes before serving.
    serving:
      servings: 6
      recipe_yield: About 8 cups
    nutrition: {calories: 1488, carbohydrates_g: 80.0, protein_g: 118.0, fat_g: 77.8, fiber_g: 26.0, sodium_mg: 2090}
