# Seed fixture for the PKM Meals domain -- example data, not part of the schema.
#
# Written in the SHAPE OF THE SCHEMA: value objects nested, references by id.
# The generator flattens or promotes per target, so this one file feeds Neo4j,
# Ladybug, and TypeQL without restating any of their differences. It exists
# mainly so the generated loaders are runnable, and so promotion is exercised
# by real data -- Chili has two images, which is the case that forces a node.

