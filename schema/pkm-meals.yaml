# LinkML data shapes for the PKM Meals domain — the first real module.
#
# NOT PUBLISHED. schema/ is excluded in _config.yml, so nothing here is a
# resolvable URI. This file generates artifacts (JSON Schema, SHACL, Pydantic,
# Cypher, TypeQL, Swift, Obsidian); it is not itself part of the namespace.
#
# Relationship to the vocabulary
# ------------------------------
# The vocabulary at w3id.org/pkm/vocab is a *terminology*: 223 skos:Concepts with
# definitions and a typed hierarchy. It deliberately carries no attributes. This
# file is the *data shape* layer, and the two are linked but not equated:
#
#   class_uri:  pkm:Recipe    -- the OWL class, in the ontology namespace
#   see_also:   pkmv:Recipe   -- the SKOS concept that defines the term
#
# rdfs:seeAlso rather than skos:exactMatch on purpose. skos:semanticRelation has
# domain and range skos:Concept, so a mapping property from an owl:Class to a
# concept is a type error -- the same trap as `owl:Class skos:exactMatch
# skos:Concept`. Enum values are the one exception: LinkML's `meaning:` slot is
# built for pointing at an external controlled vocabulary, so it takes pkmv:
# URIs directly.
#
# Where the shapes came from
# --------------------------
# The ISO 25964 relations already in the vocabulary carry most of the mapping:
#
#   isothes:narrowerGeneric    -> is_a, or enum permissible_values when the
#                                 children are leaves with no distinct slots
#   isothes:narrowerPartitive  -> a slot on the parent
#
# What ISO cannot say is a slot's range, cardinality, or whether it is required.
# Recipe makes the point: all six of its children are narrowerPartitive, and
# they resolve to four different shapes -- a multivalued object (Ingredient), a
# single inlined object (Nutrition, RecipeServing, RecipeTime, RecipeSource), a multivalued
# inlined object (RecipeImage), and a plain integer (RecipeServings, which is
# not a class at all). That residue is editorial, and it is small.

id: https://w3id.org/pkm/schema/meals
name: pkm-meals
title: PKM Meals Data Shapes
description: >-
  Data shapes for the meal-planning domain of the PKM system: recipes, their
  components, and the meal occasions that reference them. Terms are defined in
  the PKM vocabulary at https://w3id.org/pkm/vocab.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  pkm: https://w3id.org/pkm/ontology#
  pkmv: https://w3id.org/pkm/vocab/
  linkml: https://w3id.org/linkml/
  schema: https://schema.org/
  dcterms: http://purl.org/dc/terms/
default_prefix: pkm
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# Classes
#
# Three carry an identifier and are therefore standalone nodes: Recipe, Meal,
# Ingredient. The rest are value objects -- no identity of their own, inlined
# into their parent. That split is the one modelling decision that most changes
# the generated artifacts: identified classes become Neo4j nodes and SwiftData
# @Model types, value objects become nested structs and node properties.
#
# RecipeIngredient is a third case. A value object with no identifier and exactly
# one single-valued reference to an identified class is not a thing but a *use* of
# one, so it collapses into the relationship and its scalars become properties of
# that link. The generator detects the shape rather than being told.
# ---------------------------------------------------------------------------

classes:

  Recipe:
    class_uri: pkm:Recipe
    description: >-
      A set of ingredients, instructions, nutrition, and information to prepare,
      cook, and eat a meal.
    comments:
      - Reusable building block referenced by meals, per the concept's scope note.
      - >-
        The definition names "instructions", which has no concept in 0.1.3.
        Candidate addition for 0.1.4.
    see_also:
      - pkmv:Recipe
      - https://schema.org/Recipe
    slots:
      - id
      - name
      - instructions
      - serving
      - ingredients
      - nutrition
      - preparation
      - images
      - source

  Meal:
    class_uri: pkm:Meal
    description: >-
      An eating occasion consisting of one or more foods or recipes consumed at a
      particular time.
    comments:
      - >-
        The occasion itself, not the recipe or ingredient content -- so `recipes`
        is a reference, not a composition.
    see_also:
      - pkmv:Meal
    slots:
      - id
      - name
      - meal_kind
      - served_at
      - recipes
      - nutrition

  Ingredient:
    class_uri: pkm:Ingredient
    description: >-
      An individual food item or component used in the preparation of a recipe.
    comments:
      - >-
        Identified rather than inlined: the same ingredient recurs across
        recipes, which is what makes it worth a node in the graph.
      - >-
        quantity and unit lived here until 0.1.4 and moved to RecipeIngredient.
        Recurrence is exactly why they could not stay: one node, two recipes,
        two different amounts.
      - >-
        nutrition has the same defect and has not been fixed. The seed figures
        are scoped to the recipe's amount, so they belong to the use as much as
        quantity did. The fix is different, though -- a reference quantity on
        the ingredient with the recipe's contribution derived -- so it waits.
    see_also:
      - pkmv:Ingredient
    slots:
      - id
      - name
      - nutrition

  RecipeIngredient:
    class_uri: pkm:RecipeIngredient
    description: >-
      One recipe's use of one ingredient: which ingredient, and how much of it.
    comments:
      - >-
        An association class. No identifier, and exactly one single-valued
        reference to an identified class -- which is the whole detection rule,
        because there is nothing else a class of that shape could mean. It
        collapses into HAS_INGREDIENT and its scalars become properties of the
        link rather than a node wedged between recipe and ingredient.
      - >-
        Collapsing also sidesteps a TypeDB collision: promoted, this would be
        both the entity `recipe-ingredient` and the relation of the same name,
        in TypeDB's one global namespace for both.
      - >-
        quantity and unit are kept as two slots rather than one Amount value
        object. Both project onto a node property or a relationship property
        without further choices, whereas an Amount would flatten to
        amount_quantity/amount_unit and commit the vocabulary to concepts that
        do not exist yet.
      - >-
        No pkmv: concept yet -- a 0.1.4 minting candidate, alongside Amount and
        UnitOfMeasure.
    slots:
      - ingredient
      - quantity
      - unit

  Nutrition:
    class_uri: pkm:Nutrition
    description: >-
      The nutrient content (e.g. calories, carbohydrates, fat, fiber) associated
      with a meal, recipe, or ingredient.
    comments:
      - >-
        Aggregate values, so a value object rather than a node -- there is no
        such thing as "the same nutrition" shared between two recipes.
      - Carbohydrates are called out separately because carb totals drive the recipe cards.
      - >-
        None of the six nutrients below exist as concepts -- pkmv:Nutrition has no
        narrowerPartitive children at all, so the definition's "e.g. calories,
        carbohydrates, fat, fiber" is the only place they are named. Protein and
        sodium are not even named there. Mint all six in 0.1.4.
    see_also:
      - pkmv:Nutrition
    slots:
      - calories
      - carbohydrates_g
      - protein_g
      - fat_g
      - fiber_g
      - sodium_mg

  RecipeServing:
    class_uri: pkm:RecipeServing
    description: >-
      How much a recipe makes, both as a portion count and as the yield the
      source states.
    comments:
      - >-
        Two properties, so a value object rather than the scalar this was in
        0.1.3: servings scales the ingredient list, while yield is what the
        source actually claims ("makes 24 cookies", "one 9-inch loaf") and does
        not always reduce to a number.
      - >-
        pkmv:RecipeServings is defined as "the number of servings or portions a
        recipe yields" -- a count, which is now only one of the two slots. Either
        broaden that definition and add a RecipeYield narrowerPartitive child in
        0.1.4, or keep it scalar and mint a separate grouping concept.
    see_also:
      - pkmv:RecipeServings
    slots:
      - servings
      - recipe_yield

  RecipeTime:
    class_uri: pkm:RecipeTime
    description: >-
      The time-related metadata for a recipe, such as preparation time, cook
      time, and total time.
    comments:
      - >-
        The concept's definition names three components but the vocabulary gives
        it no narrower terms, so these three slots have no concepts behind them
        yet. Candidate additions for 0.1.4.
      - >-
        total_minutes is stored rather than derived: recipe sources state a total
        that does not always equal prep + cook.
    see_also:
      - pkmv:RecipeTime
    slots:
      - prep_minutes
      - cook_minutes
      - total_minutes

  RecipeSource:
    class_uri: pkm:RecipeSource
    description: >-
      The origin or provenance of a recipe, such as the website, cookbook, or
      person it was sourced from.
    see_also:
      - pkmv:RecipeSource
    slots:
      - name
      - url
      - source_kind

  RecipeImage:
    class_uri: pkm:RecipeImage
    description: The photo or image assets associated with a recipe.
    comments:
      - >-
        Singular, where the concept is pkmv:RecipeImages. A class names one
        thing and the slot carries the cardinality. Worth deciding for 0.1.4
        whether the concept should be renamed to match.
    see_also:
      - pkmv:RecipeImages
    slots:
      - url
      - caption

# ---------------------------------------------------------------------------
# Enums
#
# DayMealKind is derived mechanically: Breakfast, Lunch, Dinner and Snack are
# all isothes:broaderGeneric under DayMeal, and all four are leaves with no
# distinct slots. Generic children that bottom out like that are enum values,
# not subclasses -- that is the second half of the generic mapping rule.
# ---------------------------------------------------------------------------

enums:

  DayMealKind:
    description: Which occasion within a day a meal represents.
    comments:
      - >-
        The concepts sit under pkmv:DayMeal, not pkmv:Meal, though Meal's scope
        note claims them. Worth reconciling in 0.1.4.
    permissible_values:
      Breakfast:
        meaning: pkmv:Breakfast
      Lunch:
        meaning: pkmv:Lunch
      Dinner:
        meaning: pkmv:Dinner
      Snack:
        meaning: pkmv:Snack

  SourceKind:
    description: The kind of origin a recipe was sourced from.
    comments:
      - >-
        Read off RecipeSource's definition, not off the hierarchy -- these three
        have no concepts. Either mint them in 0.1.4 or drop the enum for a
        free-text string.
    permissible_values:
      Website:
      Cookbook:
      Person:

# ---------------------------------------------------------------------------
# Slots
# ---------------------------------------------------------------------------

slots:

  id:
    identifier: true
    range: uriorcurie
    description: Stable identifier for this instance.

  name:
    slot_uri: schema:name
    required: true
    description: Human-readable name.

  instructions:
    multivalued: true
    description: Ordered preparation steps.

  serving:
    range: RecipeServing
    inlined: true
    description: How much the recipe makes.

  servings:
    range: integer
    description: The number of servings or portions a recipe yields.

  recipe_yield:
    range: string
    description: The yield as the source states it, when it is not a portion count.
    comments:
      - >-
        Named recipe_yield rather than yield because `yield` is a Python keyword,
        and gen-pydantic would emit it as a field name.
    see_also:
      - https://schema.org/recipeYield

  ingredients:
    description: The food items and components the recipe calls for.
    range: RecipeIngredient
    multivalued: true
    inlined_as_list: true

  ingredient:
    description: The ingredient this line of the recipe calls for.
    range: Ingredient
    required: true

  nutrition:
    description: Aggregate nutrient content for this item.
    range: Nutrition
    inlined: true

  preparation:
    range: RecipeTime
    inlined: true
    description: Preparation, cook, and total times.

  images:
    description: Photo assets used in list and detail views.
    range: RecipeImage
    multivalued: true
    inlined_as_list: true

  source:
    description: Where the recipe came from.
    range: RecipeSource
    inlined: true

  quantity:
    range: float
    description: How much of the ingredient the recipe calls for.
    comments:
      - >-
        A property of the relationship, not of either end. See RecipeIngredient.

  unit:
    description: The unit the quantity is expressed in.
    comments:
      - >-
        Free text for now; a UnitOfMeasure enum is a 0.1.4 candidate. It will
        need a dimension tag before it is useful: lb and oz are mass, cup is
        volume, can is packaging, and they do not inter-convert. So any
        convert(to:) has to be failable -- unlike the single-dimension diabetes
        events, where every unit in play measured the same quantity.

  calories:
    description: Energy content in kilocalories.
    range: float

  carbohydrates_g:
    range: float
    description: Carbohydrates in grams.

  protein_g:
    range: float
    description: Protein in grams.
    comments:
      - No pkmv concept. Mint in 0.1.4.

  fat_g:
    range: float
    description: Fat in grams.

  fiber_g:
    range: float
    description: Fiber in grams.

  sodium_mg:
    range: float
    description: Sodium in milligrams.
    comments:
      - >-
        Milligrams, unlike the macronutrients -- the unit belongs to the slot, which
        is why these are not a repeated Nutrient value object keyed by a
        UnitOfMeasure enum. Revisit if micronutrients arrive.
      - No pkmv concept. Mint in 0.1.4.

  prep_minutes:
    description: Hands-on preparation time in minutes.
    range: integer

  cook_minutes:
    description: Cooking time in minutes.
    range: integer

  total_minutes:
    description: Total time in minutes, as stated by the source.
    range: integer

  url:
    description: Web address of the resource.
    range: uri

  source_kind:
    description: Which kind of origin the recipe was sourced from.
    range: SourceKind

  caption:
    description: Short text describing the image.

  meal_kind:
    description: Which occasion within a day this meal represents.
    range: DayMealKind

  served_at:
    description: When the meal was, or is to be, eaten.
    range: datetime
    slot_uri: dcterms:date

  recipes:
    range: Recipe
    multivalued: true
    description: Recipes this meal occasion draws on.
    comments:
      - >-
        A reference, not a composition -- the recipe outlives the occasion. No
        skos:related links Meal and Recipe in 0.1.3 even though Recipe's scope
        note says "referenced by meals". Candidate for 0.1.4.
